name: "Setup Environment"
description: "Setup pnpm, Node.js, Rust, and dependency caching for koko-notes-whisper CI"

inputs:
  rust:
    description: "Install Rust toolchain (set 'false' for frontend-only jobs)"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    # pnpm version is pinned by the `packageManager` field in
    # package.json (`pnpm@10.27.0`). `pnpm/action-setup` errors out
    # with ERR_PNPM_BAD_PM_VERSION when both `inputs.version` and a
    # `packageManager` spec are present, so we deliberately omit
    # `with: version`. Bump `packageManager` in package.json to move.
    - name: Setup pnpm
      uses: pnpm/action-setup@v4

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: "22"
        cache: "pnpm"

    - name: Install frontend dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Setup Rust
      if: inputs.rust == 'true'
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Rust dependencies and build artifacts
      if: inputs.rust == 'true'
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: src-tauri
        shared-key: "rust-tauri"
