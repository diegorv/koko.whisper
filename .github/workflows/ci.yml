name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v6

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            frontend:
              - "src/**"
              - "static/**"
              - "pnpm-lock.yaml"
              - "package.json"
              - "tsconfig.json"
              - "svelte.config.*"
              - "vite.config.*"
              - "vitest.config.*"
              # Workflow + composite-action changes can break the
              # frontend pipeline silently. Re-run the job when these
              # change so regressions surface in the same PR.
              - ".github/actions/**"
              - ".github/workflows/**"
            rust:
              - "src-tauri/**"
              - ".github/actions/**"
              - ".github/workflows/**"

  frontend:
    name: Frontend (typecheck + tests + build)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          rust: "false"

      # `pnpm check` runs `svelte-kit sync` first, which generates the
      # files vitest may need to resolve $lib aliases. No separate sync
      # step required.
      - name: Run type check
        run: pnpm check

      # `--passWithNoTests` because slice-NN PRs through ~slice 16
      # legitimately have zero frontend test files. Without it, vitest
      # exits non-zero on a slice that ships no test changes.
      - name: Run unit tests
        run: pnpm vitest run --passWithNoTests

      # Catches runtime bundle failures (SSR-incompatible imports,
      # dynamic imports that don't resolve, type-only re-exports that
      # become runtime errors) that typecheck + vitest miss. Without
      # this, those regressions only surface inside `tauri-action`
      # during release.
      - name: Build frontend bundle
        run: pnpm build

  rust:
    name: Rust (cargo test)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    # macos-latest because the project is macOS-only (tray-menu,
    # ScreenCaptureKit-backed cpal fork, macOS-specific Tauri config).
    # Linux would silently skip `#[cfg(target_os = "macos")]` modules.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Setup environment
        uses: ./.github/actions/setup

      # These env vars work around an ARM i8mm build error on macOS CI
      # runners — present in the previous CI workflow, retained here.
      - name: Run tests
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
          CFLAGS: "-U__ARM_FEATURE_MATMUL_INT8 -mmacosx-version-min=11.0"
          CXXFLAGS: "-U__ARM_FEATURE_MATMUL_INT8 -mmacosx-version-min=11.0"
        run: cargo test --manifest-path src-tauri/Cargo.toml

  # Aggregate gate intended for use as the single required status
  # check in branch protection. `frontend` and `rust` are skipped when
  # their paths filter says nothing relevant changed, which makes them
  # unusable as required checks directly. This sentinel passes when
  # every dependency either succeeded or was deliberately skipped, and
  # fails on any real failure or cancellation.
  ci-success:
    name: CI success
    needs: [changes, frontend, rust]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Aggregate gate results
        run: |
          set -euo pipefail
          changes="${{ needs.changes.result }}"
          frontend="${{ needs.frontend.result }}"
          rust="${{ needs.rust.result }}"
          echo "changes=$changes frontend=$frontend rust=$rust"
          if [ "$changes" != "success" ]; then
            echo "::error::changes job did not succeed (result=$changes)"
            exit 1
          fi
          for name in frontend rust; do
            case "$name" in
              frontend) result="$frontend" ;;
              rust) result="$rust" ;;
            esac
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "::error::$name job did not pass (result=$result)"
              exit 1
            fi
          done
          echo "All gates passed."
